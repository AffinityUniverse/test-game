<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e2859">
  <!-- OG 이미지 및 링크 미리보기 설정 -->
  <meta property="og:image" content="./og-image.png">
  <meta property="og:title" content="Affinity Game Universe">
  <meta property="og:description" content="어피니티 게임 유니버스로 초대합니다.">
  <meta property="og:type" content="website">
  <title>Affinity Game Universe</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      color-scheme: dark;
      --blue: #0064ff;
      --white: #fff;
      --line: rgba(135, 177, 255, .34)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      min-height: 100%;
      margin: 0
    }

    body {
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow-x: hidden;
      background: #80caff;
      color: var(--white)
    }

    button,
    a {
      font: inherit;
      -webkit-tap-highlight-color: transparent
    }

    button {
      cursor: pointer
    }

    [hidden] {
      display: none !important
    }

    /* Keep the original main-page background and title PNG. */
    .landing {
      position: relative;
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(28px, 5vh, 58px) 18px clamp(38px, 7vh, 78px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
      background: #80caff url('bg.png') center/cover no-repeat;
      text-align: center;
      isolation: isolate
    }

    .landing::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(17, 85, 167, .07), transparent 47%, rgba(9, 54, 126, .15));
      pointer-events: none
    }

    .landing-top {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: clamp(22px, 4vh, 40px);
    }

    .landing-title {
      display: block;
      width: min(78vw, 850px);
      max-height: min(47vh, 480px);
      object-fit: contain;
      filter: drop-shadow(0 12px 18px rgba(22, 45, 85, .14));
      animation: titleFloat 3.6s ease-in-out infinite;
      pointer-events: none
    }

    .landing-title-fallback {
      font-size: clamp(42px, 7vw, 90px);
      line-height: .96;
      letter-spacing: -.055em;
      font-weight: 950;
      text-shadow: 0 8px 22px rgba(1, 36, 105, .24)
    }

    @keyframes titleFloat {

      0%,
      100% {
        transform: translate3d(0, 0, 0) rotate(-1deg)
      }

      50% {
        transform: translate3d(0, -14px, 0) rotate(1deg)
      }
    }

    .language-area {
      width: 100%;
      max-width: 750px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px
    }

    .language-question {
      margin: 0;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 2px 10px rgba(12, 50, 116, .4);
      font-size: clamp(17px, 2vw, 23px)
    }

    .language-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: clamp(13px, 2.5vw, 24px);
      width: 100%
    }

    .glow-btn {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 102px;
      border-radius: 26px;
      border: 2px solid rgba(224, 246, 255, .92);
      padding: 17px 20px;
      color: #fff;
      background: linear-gradient(115deg, #0049d7 0%, #066cff 48%, #379fff 100%);
      box-shadow: inset 0 2px rgba(255, 255, 255, .33), 0 0 0 5px rgba(0, 100, 255, .12), 0 0 26px rgba(38, 141, 255, .72), 0 16px 34px rgba(0, 71, 209, .36);
      text-shadow: 0 2px 7px rgba(0, 29, 110, .38);
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease
    }

    .glow-btn:nth-child(2) {
      background: linear-gradient(115deg, #0752d9 0%, #2588ff 55%, #61b4ff 100%)
    }

    .glow-btn::before {
      content: "";
      position: absolute;
      top: -55%;
      bottom: -55%;
      left: -60%;
      width: 33%;
      transform: translateX(0) skewX(-22deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .42), transparent);
      pointer-events: none;
      animation: buttonShine 4.5s ease-in-out infinite
    }

    .glow-btn:nth-child(2)::before {
      animation-delay: .75s
    }

    @keyframes buttonShine {

      0%,
      17% {
        transform: translateX(0) skewX(-22deg);
        opacity: 0
      }

      24% {
        opacity: .85
      }

      48% {
        transform: translateX(690%) skewX(-22deg);
        opacity: .8
      }

      60%,
      100% {
        transform: translateX(690%) skewX(-22deg);
        opacity: 0
      }
    }

    .glow-btn:hover {
      transform: translateY(-5px) scale(1.02);
      filter: brightness(1.09);
      box-shadow: inset 0 2px rgba(255, 255, 255, .4), 0 0 0 5px rgba(0, 100, 255, .17), 0 0 38px rgba(38, 141, 255, .9), 0 20px 42px rgba(0, 71, 209, .42)
    }

    .glow-btn:active {
      transform: translateY(0) scale(.98)
    }

    .glow-btn:focus-visible,
    .game-link:focus-visible,
    .close-btn:focus-visible {
      outline: 3px solid #fff;
      outline-offset: 5px
    }

    .glow-btn strong {
      font-size: clamp(26px, 3.1vw, 38px);
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -.03em
    }

    .glow-btn small {
      font-size: 13px;
      color: #e2efff;
      font-weight: 600
    }

    /* Intro popup follows the navy Game Over / next-game panel style. */
    .intro-layer {
      position: fixed;
      inset: 0;
      z-index: 7000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(10px, 3vh, 26px);
      background: rgba(6, 10, 22, .91);
      -webkit-backdrop-filter: blur(9px);
      backdrop-filter: blur(9px);
      overflow-y: auto;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease
    }

    .intro-layer.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto
    }

    .intro-card {
      position: relative;
      width: min(1030px, 100%);
      max-height: calc(100dvh - 24px);
      overflow-y: auto;
      margin: auto;
      padding: clamp(27px, 4vw, 48px) clamp(17px, 4vw, 44px) 38px;
      border-radius: 32px;
      border: 1px solid rgba(136, 181, 255, .39);
      background: linear-gradient(150deg, #1b2744 0%, #18223c 55%, #151d32 100%);
      box-shadow: 0 32px 90px rgba(0, 0, 0, .50), inset 0 1px rgba(255, 255, 255, .06);
      text-align: center
    }

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(145, 187, 255, .5);
      background: #223451;
      color: #e4efff;
      font-size: 28px;
      line-height: 1
    }

    .close-btn:hover {
      background: #355780
    }

    .intro-label {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      margin: 0 0 18px;
      padding: 6px 17px;
      border: 1px solid rgba(120, 170, 255, .38);
      border-radius: 999px;
      background: rgba(0, 100, 255, .14);
      color: #a9caff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .075em
    }

    .intro-title {
      margin: 0 auto;
      max-width: 850px;
      color: #fff;
      font-size: clamp(27px, 4.1vw, 47px);
      line-height: 1.26;
      letter-spacing: -.04em;
      font-weight: 900;
      word-break: keep-all
    }

    .intro-desc {
      margin: 15px auto 29px;
      font-size: clamp(14px, 1.6vw, 17px);
      line-height: 1.55;
      color: #c4d0e4
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px
    }

    .game-link {
      min-width: 0;
      min-height: 178px;
      padding: 20px 9px 17px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: linear-gradient(145deg, #22304f, #1d2843);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .18);
      color: #fff;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: transform .17s ease, background .17s ease, border-color .17s ease, box-shadow .17s ease
    }

    .game-link:hover {
      transform: translateY(-5px);
      background: linear-gradient(145deg, #274471, #21345a);
      border-color: #70b3ff;
      box-shadow: 0 16px 32px rgba(0, 104, 255, .24)
    }

    .game-link:active {
      transform: translateY(-1px)
    }

    .game-icon {
      width: 64px;
      height: 59px;
      border-radius: 17px;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      background: linear-gradient(140deg, #0056e9, #318bff);
      box-shadow: 0 8px 20px rgba(0, 104, 255, .25);
      font-size: 27px;
      line-height: 1;
      font-weight: 900
    }

    .game-link strong {
      font-weight: 850;
      font-size: clamp(15px, 1.5vw, 20px);
      line-height: 1.25;
      letter-spacing: -.025em;
      word-break: keep-all
    }

    .game-link small {
      font-size: 12px;
      font-weight: 550;
      line-height: 1.35;
      color: #bbc9df;
      word-break: keep-all
    }

    .intro-footer {
      margin: 21px 0 0;
      font-size: 12px;
      color: #8295b5
    }

    @media(max-width:800px) {
      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px
      }

      .game-link {
        min-height: 146px
      }

      .intro-card {
        padding-bottom: 25px
      }

      .intro-desc {
        margin-bottom: 22px
      }
    }

    @media(max-width:480px) {
      .landing {
        padding: 32px 14px 44px
      }

      .landing-title {
        width: min(95vw, 560px);
        max-height: 40vh
      }

      .language-area {
        gap: 13px
      }

      .language-question {
        font-size: 16px
      }

      .language-buttons {
        gap: 11px
      }

      .glow-btn {
        min-height: 90px;
        padding: 16px 9px;
        border-radius: 19px
      }

      .glow-btn strong {
        font-size: 27px
      }

      .glow-btn small {
        font-size: 11px
      }

      .intro-card {
        border-radius: 22px;
        padding: 25px 13px 21px
      }

      .intro-label {
        margin-bottom: 13px;
        font-size: 10px
      }

      .intro-title {
        padding: 0 11px;
        font-size: clamp(24px, 6vw, 30px)
      }

      .intro-desc {
        margin: 11px auto 18px;
        font-size: 13px
      }

      .game-grid {
        gap: 9px
      }

      .game-link {
        min-height: 130px;
        padding: 14px 7px;
        border-radius: 16px;
        gap: 7px
      }

      .game-icon {
        width: 53px;
        height: 50px;
        border-radius: 13px;
        font-size: 23px
      }

      .game-link strong {
        font-size: 15px
      }

      .game-link small {
        font-size: 11px
      }

      .close-btn {
        top: 10px;
        right: 10px;
        width: 32px;
        height: 32px;
        font-size: 24px
      }
    }

    @media(max-height:650px) and (min-width:800px) {
      .intro-card {
        padding-top: 23px;
        padding-bottom: 21px
      }

      .intro-label {
        margin-bottom: 10px
      }

      .intro-title {
        font-size: 32px
      }

      .intro-desc {
        margin: 9px auto 17px
      }

      .game-link {
        min-height: 135px
      }

      .game-icon {
        width: 50px;
        height: 48px;
        font-size: 23px
      }

      .intro-footer {
        margin-top: 13px
      }
    }

    /* Mobile-only main background; keep bg.png unchanged on desktop/tablet. */
    @media (max-width: 767px), (max-height: 500px) and (pointer: coarse) {
      .landing {
        background-image: url('bg-mo.png');
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .landing-title,
      .glow-btn::before {
        animation: none
      }

      .glow-btn,
      .game-link,
      .intro-layer {
        transition: none
      }
    }
  
    /* Main game entry point: title -> GAME START -> language -> four games. */
    .landing {
      padding: clamp(14px, 3.5vh, 40px) 16px clamp(22px, 5.5vh, 64px);
      gap: 16px;
    }
    .landing-title {
      width: min(68vw, 710px);
      max-height: min(35vh, 295px);
      filter: drop-shadow(0 10px 15px rgba(11, 52, 148, .18));
    }
    .landing-title-fallback {
      margin: 0;
      font-size: clamp(36px, 6.2vw, 83px);
      line-height: 1.1;
      color: white;
      -webkit-text-stroke: 3px #0064ff;
      paint-order: stroke fill;
    }
    .start-area {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: clamp(0px, 3.5vh, 42px);
    }
    .start-btn {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 17px;
      min-width: min(370px, 92vw);
      min-height: 83px;
      padding: 13px 32px 13px 16px;
      border: 3px solid rgba(236, 250, 255, .98);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(115deg, #0349d9, #0064ff 52%, #38a9ff);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, .38),
        0 4px 0 rgba(12, 52, 138, .27),
        0 0 0 8px rgba(23, 117, 255, .22),
        0 0 36px 10px rgba(16, 126, 255, .75),
        0 16px 34px rgba(0, 52, 143, .47);
      font-weight: 950;
      font-size: clamp(23px, 2.4vw, 31px);
      letter-spacing: -.025em;
      text-shadow: 0 2px 4px rgba(0, 45, 111, .48);
      transition: transform .2s ease, filter .2s ease, box-shadow .2s ease;
      animation: startPulse 2.8s ease-in-out infinite;
    }
    .start-btn::after {
      content: '';
      position: absolute;
      inset: -11px;
      border: 2px solid rgba(138, 218, 255, .32);
      border-radius: inherit;
      pointer-events: none;
    }
    .start-btn:hover {
      transform: translateY(-5px) scale(1.045);
      filter: brightness(1.1);
      box-shadow:
        inset 0 3px 0 rgba(255, 255, 255, .43),
        0 5px 0 rgba(12, 52, 138, .27),
        0 0 0 10px rgba(23, 117, 255, .25),
        0 0 49px 15px rgba(16, 126, 255, .9),
        0 19px 42px rgba(0, 52, 143, .55);
    }
    .start-btn:active { transform: translateY(0) scale(.975); }
    .start-btn:focus-visible, .back-btn:focus-visible {
      outline: 3px solid #fff; outline-offset: 7px;
    }
    .start-play {
      display: grid;
      place-items: center;
      flex: none;
      width: 49px;
      height: 49px;
      border-radius: 50%;
      color: #0064ff;
      background: #fff;
      box-shadow: inset 0 -2px 0 rgba(9, 57, 135, .13), 0 0 18px rgba(255,255,255,.68);
    }
    .start-play svg { width: 24px; height: 24px; margin-left: 3px; }
    @keyframes startPulse {
      0%, 100% { box-shadow: inset 0 3px 0 rgba(255,255,255,.38), 0 4px 0 rgba(12,52,138,.27), 0 0 0 8px rgba(23,117,255,.22), 0 0 28px 8px rgba(16,126,255,.64), 0 16px 34px rgba(0,52,143,.47); }
      50% { box-shadow: inset 0 3px 0 rgba(255,255,255,.38), 0 4px 0 rgba(12,52,138,.27), 0 0 0 11px rgba(23,117,255,.19), 0 0 43px 13px rgba(16,126,255,.85), 0 16px 34px rgba(0,52,143,.47); }
    }
    .intro-card.is-language { width: min(710px, 100%); }
    .intro-card.is-games { width: min(1030px, 100%); }
    .intro-card.is-language .language-buttons { max-width: 560px; margin: 26px auto 6px; }
    .intro-card.is-language .glow-btn { min-height: 100px; }
    .intro-card.is-language .intro-desc { margin-bottom: 18px; }
    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid rgba(141, 193, 255, .46);
      background: rgba(59, 98, 158, .25);
      color: #d4e7ff;
      border-radius: 999px;
      font-weight: 750;
      font-size: 13px;
      padding: 10px 16px;
      margin: 15px 0 0;
    }
    .back-btn:hover { background: rgba(69, 132, 227, .43); }
    .step-count { color: #a9caff; }
    @media (max-width: 767px), (max-height: 500px) and (pointer: coarse) {
      .landing {
        /* If bg-mo.png is unavailable, the updated bg.png remains visible. */
        background-image: url('bg-mo.png'), url('bg.png');
        background-size: cover, cover;
        background-position: center center, center center;
        background-repeat: no-repeat, no-repeat;
      }
    }
    @media (max-width: 600px) {
      .landing { padding: 18px 10px clamp(24px, 7vh, 66px); }
      .landing-title { width: min(96vw, 620px); max-height: 31vh; }
      .start-area { padding-bottom: clamp(0px, 3vh, 28px); }
      .start-btn { min-width: min(305px, 88vw); min-height: 69px; padding: 10px 22px 10px 12px; gap: 12px; font-size: 23px; border-width: 2px; }
      .start-play { width: 43px; height: 43px; }
      .start-play svg { width: 22px; height: 22px; }
      .intro-card.is-language .language-buttons { gap: 10px; }
      .intro-card.is-language .glow-btn { min-height: 94px; }
    }
    @media (max-width: 350px) {
      .intro-card.is-language .language-buttons { grid-template-columns: 1fr; }
      .intro-card.is-language .glow-btn { min-height: 73px; padding: 10px 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .start-btn { animation: none; }
    }

  </style>
</head>
<body>
  <main id="landing" class="landing">
    <div class="landing-top">
      <img id="titleImage" class="landing-title" src="title.png" alt="어피니티 유니버스" draggable="false">
      <h1 id="titleFallback" class="landing-title-fallback" hidden>어피니티<br>유니버스</h1>
    </div>
    <section class="start-area" aria-label="게임 시작">
      <button type="button" id="startBtn" class="start-btn" aria-haspopup="dialog" aria-controls="introLayer">
        <span class="start-play" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 3.7c0-.86.94-1.4 1.69-.97l11.02 7.37a2.3 2.3 0 0 1 0 3.82L8.69 21.3c-.75.5-1.69-.04-1.69-.95V3.7Z" fill="currentColor"/></svg>
        </span>
        <span>GAME START</span>
      </button>
    </section>
  </main>

  <div id="introLayer" class="intro-layer" role="dialog" aria-modal="true" aria-labelledby="languageTitle" aria-hidden="true" inert>
    <div id="introCard" class="intro-card is-language">
      <button id="closeIntro" class="close-btn" type="button" aria-label="닫기">×</button>
      <section id="languageStep" aria-labelledby="languageTitle">
        <div class="intro-label">STEP 01 <span class="step-count">&nbsp; / 02 · LANGUAGE</span></div>
        <h2 id="languageTitle" class="intro-title">언어를 선택해 주세요.</h2>
        <p class="intro-desc">Choose your language to continue.</p>
        <div class="language-buttons" aria-label="언어 선택">
          <button type="button" class="glow-btn" data-lang="ko"><strong>한국어</strong><small>Korean</small></button>
          <button type="button" class="glow-btn" data-lang="en"><strong>English</strong><small>영어</small></button>
        </div>
      </section>
      <section id="gameStep" aria-labelledby="gameTitle" hidden>
        <div class="intro-label">STEP 02 <span class="step-count">&nbsp; / 02 · SELECT GAME</span></div>
        <h2 id="gameTitle" class="intro-title"></h2>
        <p id="gameDesc" class="intro-desc"></p>
        <nav id="gameGrid" class="game-grid" aria-label="게임 선택"></nav>
        <p id="gameFooter" class="intro-footer"></p>
        <button type="button" id="backBtn" class="back-btn">← 언어 다시 선택</button>
      </section>
    </div>
  </div>

  <script>
    // Preserve original Korean and English game filenames and typing-language URLs.
    const content = {
      ko: {
        title: '어피니티 유니버스에 오신 걸 환영해요! 🚀',
        desc: '어떤 게임부터 시작할까요? 원하는 모험을 선택해 보세요.',
        footer: '원하는 게임을 누르면 해당 페이지로 이동합니다.',
        nav: '게임 선택', close: '닫기', back: '← 언어 다시 선택',
        games: [
          { icon: '✎', name: '튜토리얼', detail: '디자인 기초 익히기', href: 'tutorial.html' },
          { icon: '⌨', name: '단축키 게임', detail: '어피니티 단축키 연습', href: 'shortcut.html' },
          { icon: '가', name: '한국어 타이핑', detail: '쉬운 한글 단어 연습', href: 'typinggame.html?lang=ko' },
          { icon: 'Aa', name: '영어 타이핑', detail: '영어 단어 연습', href: 'typinggame.html?lang=en' }
        ]
      },
      en: {
        title: 'Welcome to Affinity Universe! 🚀',
        desc: 'Ready for an adventure? Choose a game to begin.',
        footer: 'Choose a game to open its page.',
        nav: 'Choose a game', close: 'Close', back: '← Change language',
        games: [
          { icon: '✎', name: 'Tutorial', detail: 'Learn the design basics', href: 'tutorial_en.html' },
          { icon: '⌨', name: 'Shortcut Game', detail: 'Practice Affinity shortcuts', href: 'shortcut_en.html' },
          { icon: '가', name: 'Korean Typing', detail: 'Practice Hangul words', href: 'typinggame_en.html?lang=ko' },
          { icon: 'Aa', name: 'English Typing', detail: 'Practice English words', href: 'typinggame_en.html?lang=en' }
        ]
      }
    };

    const landing = document.getElementById('landing');
    const layer = document.getElementById('introLayer');
    const card = document.getElementById('introCard');
    const languageStep = document.getElementById('languageStep');
    const gameStep = document.getElementById('gameStep');
    const grid = document.getElementById('gameGrid');
    const closeButton = document.getElementById('closeIntro');
    const backButton = document.getElementById('backBtn');
    let previousFocus = null;

    function showLanguageStep() {
      languageStep.hidden = false;
      gameStep.hidden = true;
      card.classList.replace('is-games', 'is-language');
      layer.setAttribute('aria-labelledby', 'languageTitle');
      document.documentElement.lang = 'ko';
      languageStep.querySelector('[data-lang="ko"]').focus();
    }

    function openIntro() {
      previousFocus = document.activeElement;
      layer.inert = false;
      layer.classList.add('open');
      layer.setAttribute('aria-hidden', 'false');
      landing.inert = true;
      showLanguageStep();
    }

    function selectLanguage(lang) {
      const data = content[lang] || content.ko;
      document.documentElement.lang = lang;
      document.getElementById('gameTitle').textContent = data.title;
      document.getElementById('gameDesc').textContent = data.desc;
      document.getElementById('gameFooter').textContent = data.footer;
      grid.setAttribute('aria-label', data.nav);
      closeButton.setAttribute('aria-label', data.close);
      backButton.textContent = data.back;
      grid.replaceChildren();
      for (const item of data.games) {
        const link = document.createElement('a');
        link.className = 'game-link';
        link.href = item.href;
        const icon = document.createElement('span');
        icon.className = 'game-icon';
        icon.setAttribute('aria-hidden', 'true');
        icon.textContent = item.icon;
        const title = document.createElement('strong');
        title.textContent = item.name;
        const detail = document.createElement('small');
        detail.textContent = item.detail;
        link.append(icon, title, detail);
        grid.appendChild(link);
      }
      languageStep.hidden = true;
      gameStep.hidden = false;
      card.classList.replace('is-language', 'is-games');
      layer.setAttribute('aria-labelledby', 'gameTitle');
      grid.querySelector('a')?.focus();
    }

    function closeIntro() {
      layer.classList.remove('open');
      layer.setAttribute('aria-hidden', 'true');
      layer.inert = true;
      landing.inert = false;
      document.documentElement.lang = 'ko';
      closeButton.setAttribute('aria-label', '닫기');
      previousFocus?.focus();
    }

    document.getElementById('startBtn').addEventListener('click', openIntro);
    document.querySelectorAll('[data-lang]').forEach(button => {
      button.addEventListener('click', () => selectLanguage(button.dataset.lang));
    });
    backButton.addEventListener('click', showLanguageStep);
    closeButton.addEventListener('click', closeIntro);
    layer.addEventListener('click', event => { if (event.target === layer) closeIntro(); });
    document.addEventListener('keydown', event => {
      if (!layer.classList.contains('open')) return;
      if (event.key === 'Escape') { event.preventDefault(); closeIntro(); return; }
      if (event.key === 'Tab') {
        const items = [...layer.querySelectorAll('button:not([disabled]), a[href]')].filter(el => el.getClientRects().length > 0);
        const first = items[0];
        const last = items[items.length - 1];
        if (!first || !last) return;
        if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
        else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
      }
    });
    document.getElementById('titleImage').addEventListener('error', event => {
      event.currentTarget.hidden = true;
      document.getElementById('titleFallback').hidden = false;
    });
  </script>
</body>
</html>
